<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connection test</title>
  <style>
    :root { color-scheme: light dark; font-family: var(--font-sans, "Segoe UI", "Microsoft YaHei", sans-serif); color: var(--color-text-primary, light-dark(#202020, #ededed)); background: var(--color-background-primary, light-dark(#fff, #212121)); letter-spacing: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { padding: 28px 24px 20px; min-height: 176px; width: 100%; }
    .result { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; min-height: 76px; }
    .status-icon { width: 24px; height: 24px; margin-top: 1px; }
    .success { color: light-dark(#167448, #72cb9d); }
    .failure { color: light-dark(#c03434, #fa9090); }
    h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; line-height: 26px; }
    p { margin: 4px 0; font-size: 14px; line-height: 22px; color: var(--color-text-secondary, light-dark(#606060, #b5b5b5)); overflow-wrap: anywhere; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; }
    footer span { font-size: 12px; color: var(--color-text-secondary, light-dark(#606060, #b5b5b5)); }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; flex-shrink: 0; padding: 0 12px; font: inherit; font-size: 13px; color: inherit; background: transparent; border: 1px solid var(--color-border-primary, light-dark(#d8d8d8, #535353)); border-radius: 6px; cursor: pointer; }
    button:hover:enabled { background: var(--color-background-secondary, light-dark(#f1f1f1, #333)); }
    button:focus-visible { outline: 2px solid var(--color-text-primary, currentColor); outline-offset: 3px; }
    button:disabled { opacity: .45; cursor: default; }
    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinning { animation: none; } }
    @media (max-width: 360px) { main { padding: 24px 16px 16px; } }
  </style>
</head>
<body><div id="root"></div><script>__CONNECTION_TEST_SCRIPT__</script></body>
</html>
